<section aria-labelledby="expenses-title">
  <app-breadcrumb [items]="[{ label: 'Gestione', link: '/expenses' }, { label: 'Spese' }]" />
  <app-page-header title="Spese" subtitle="Consulta, filtra e gestisci tutte le tue spese.">
    <div class="d-flex flex-wrap align-items-center gap-3">
      <div class="form-check form-switch mb-0">
        <input id="show-future-expenses" class="form-check-input" type="checkbox" role="switch" [checked]="showFuture()" (change)="toggleFuture($event)">
        <label class="form-check-label" for="show-future-expenses">Mostra spese future</label>
      </div>
      <div class="d-flex flex-wrap gap-2">
      <button class="btn btn-outline-secondary" type="button" [disabled]="exporting()" (click)="exportCsv()">@if (exporting()) { <span class="spinner-border spinner-border-sm me-2"></span> } @else { <i class="bi bi-download me-2"></i> }Esporta CSV</button>
      <button class="btn btn-primary" type="button" (click)="newExpense()"><i class="bi bi-plus-lg me-2"></i>Nuova spesa</button>
      </div>
    </div>
  </app-page-header>

  @if (notice(); as currentNotice) { <div class="alert" [class.alert-success]="currentNotice.type === 'success'" [class.alert-danger]="currentNotice.type === 'danger'" role="status"><div class="d-flex justify-content-between gap-3"><span>{{ currentNotice.text }}</span><button class="btn-close" type="button" aria-label="Chiudi" (click)="notice.set(null)"></button></div></div> }

  <div class="row g-3 mb-3" aria-label="Riepilogo spese filtrate">
    <div class="col-6 col-xl-3"><app-counter-card label="Totale risultati" [value]="summary().totalResults" icon="bi-receipt" [interactive]="true" (activated)="filterByStatus()" /></div>
    <div class="col-6 col-xl-3"><app-counter-card label="Completate" [value]="summary().completed" icon="bi-check-circle" [interactive]="true" (activated)="filterByStatus('COMPLETED')" /></div>
    <div class="col-6 col-xl-3"><app-counter-card label="Pianificate" [value]="summary().planned" icon="bi-clock-history" [interactive]="true" (activated)="filterByStatus('PLANNED')" /></div>
    <div class="col-6 col-xl-3"><app-counter-card label="Annullate" [value]="summary().cancelled" icon="bi-x-circle" [interactive]="true" (activated)="filterByStatus('CANCELLED')" /></div>
  </div>

  <app-expense-filters [query]="query()" [categories]="categories()" [labels]="labels()" [defaultPageSize]="defaultPageSize()" (queryChange)="applyFilters($event)" />

  <article class="card expense-list-card">
    @if (loading()) { <app-loading-skeleton /> }
    @else if (expenses().length === 0) { <app-empty-state title="Nessuna spesa trovata" message="Modifica i filtri oppure registra una nuova spesa."><button class="btn btn-primary" type="button" (click)="newExpense()"><i class="bi bi-plus-lg me-2" aria-hidden="true"></i>Nuova spesa</button></app-empty-state> }
    @else {
      <app-expense-table [expenses]="expenses()" [sortBy]="query().sortBy" [sortDirection]="query().sortDirection" (view)="viewExpense($event)" (edit)="editExpense($event)" (duplicate)="duplicateExpense($event)" (statusChange)="updateStatus($event)" (remove)="deleteTarget.set($event)" (sort)="sortBy($event)" />
      <app-pagination [meta]="meta()" (pageChange)="goToPage($event)" />
    }
  </article>
</section>

<app-confirm-dialog [open]="deleteTarget() !== null" title="Elimina spesa" [message]="'La spesa “' + (deleteTarget()?.description ?? '') + '” verrà eliminata. I dati non saranno più visibili.'" confirmLabel="Elimina" [busy]="deleting()" (confirmed)="confirmDelete()" (cancelled)="deleteTarget.set(null)" />
