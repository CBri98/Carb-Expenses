name: carbexpenses

services:
  mariadb:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DATABASE_NAME:-expense_manager}
      MARIADB_USER: ${DATABASE_USER:-expense_user}
      MARIADB_PASSWORD: ${DATABASE_PASSWORD:-change_me}
      MARIADB_ROOT_PASSWORD: ${DATABASE_ROOT_PASSWORD:-change_me_root}
      TZ: ${DEFAULT_TIMEZONE:-Europe/Rome}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "${DATABASE_PORT:-3306}:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - expense_network

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      BACKEND_PORT: 3000
      DATABASE_URL: mysql://${DATABASE_USER:-expense_user}:${DATABASE_PASSWORD:-change_me}@mariadb:3306/${DATABASE_NAME:-expense_manager}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:4200}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-development_access_secret_change_before_deploy_2026}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-development_refresh_secret_change_before_deploy_2026}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-30d}
      REFRESH_TOKEN_COOKIE: ${REFRESH_TOKEN_COOKIE:-refresh_token}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_SAME_SITE: ${COOKIE_SAME_SITE:-lax}
      DEFAULT_CURRENCY: ${DEFAULT_CURRENCY:-EUR}
      DEFAULT_TIMEZONE: ${DEFAULT_TIMEZONE:-Europe/Rome}
      DEMO_USER_EMAIL: ${DEMO_USER_EMAIL:-demo@expense.local}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:-DemoExpense2026!}
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    depends_on:
      mariadb:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/api/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - expense_network

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 4200
    ports:
      - "${FRONTEND_PORT:-4200}:4200"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:4200').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - expense_network

volumes:
  mariadb_data:

networks:
  expense_network:
    driver: bridge
